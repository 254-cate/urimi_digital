<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Officer Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("markus-winkler-HeqXGxnsnX4-unsplash.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    padding:40px;
}

.container{

    width:450px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(10px);

    padding:40px;

    border-radius:15px;

    box-shadow:0 8px 20px rgba(0,0,0,.4);

    color:white;

}

.logo{

    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

h2{

    text-align:center;
    color:gold;
    margin-bottom:30px;
}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{

    width:100%;
    padding:12px;
    margin-bottom:18px;

    border:none;
    border-radius:8px;

    font-size:16px;
}

input:focus{

    outline:none;
    border:2px solid #4CAF50;
}

button{

    width:100%;

    padding:15px;

    background:#4CAF50;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#2E7D32;
    transform:scale(1.02);
}

p{

    text-align:center;
    margin-top:20px;
}

a{

    color:gold;
    text-decoration:none;
    font-weight:bold;
}

a:hover{

    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🧑‍🌾</div>

<h2>Agricultural Officer Registration</h2>
{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}


<form action="" method="POST"  enctype="multipart/form-data">
    {%csrf_token %}
<label>📷 Profile Photo</label>
    <input type="file" name="photo" accept="image/*">
<label>Full Name</label>
<input type="text" name="fullname" placeholder="Enter your full name" required>

<label>Username</label>
<input type="text" name="username" placeholder="Choose a username" required>
<label>Password</label>
<input type="password" name="password" placeholder="Create a password" required>

<label>Confirm Password</label>
<input type="password" name="confirm_password" placeholder="Confirm password" required>

<label>Profession / Specialization</label>

    <input
        type="text"
        name="specialization"
        placeholder="e.g. Crop Specialist, Livestock Officer">
<label>Phone Number</label>
    <input type="text"
           name="phone_number"
           placeholder="07XXXXXXXX">
<label>County</label>

    <select name="county" required>
        <option value="">Select County</option>

        {% for county in counties %}
            <option value="{{ county.id }}">
                {{ county.name }}
            </option>
        {% endfor %}
    </select>



<button type="submit">Register</button>

</form>

<p>
Already have an account?
<a href="{% url 'officerlogin'%">Login Here</a>
</p>

</div>

</body>
</html>
