!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Crop Advice</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f4;
}

header {
    background: #2e7d32;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h2 {
    color: #2e7d32;
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1b5e20;
}

.back {
    display: block;
    margin-top: 15px;
    text-align: center;
    color: #2e7d32;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>🌱 Edit Farm Advice</h1>
</header>

<div class="container">

<h2>Send Advice to Farmer</h2>

<form method="POST">
    {% csrf_token %}

    

    <label>Category</label>

<select name="category">

    <option value="CROP" {% if advice.category == "CROP" %}selected{% endif %}>
        Crop
    </option>

    <option value="LIVESTOCK" {% if advice.category == "LIVESTOCK" %}selected{% endif %}>
        Livestock
    </option>

</select>

<label>Farm Item</label>

<input
    type="text"
    name="farm_item"
    value="{{ advice.farm_item }}"
    required
>
    <label>Advice</label>
   <textarea
    name="advice"
    rows="6"
    required
>{{ advice.advice }}</textarea>
    <button type="submit">Update Advice</button>
</form>

<a href="{% url 'officerdashboard' %}" class="back">
← Back to Dashboard
</a>

</div>

</body>
</html>
