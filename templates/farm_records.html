<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Farm Records</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {
    background: #f4f6f4;
}


header {

    background: #2e7d32;

    color: white;

    padding: 20px;

    text-align: center;

}


.container {

    width: 95%;

    max-width: 1100px;

    margin: 30px auto;

}


h2 {

    margin-bottom: 20px;

    color: #2e7d32;

}



/* ADD BUTTON */

.add-btn {

    display: inline-block;

    background: #2e7d32;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    text-decoration: none;

    margin-bottom: 20px;

}


.add-btn:hover {

    background: #1b5e20;

}



/* TABLE */

table {

    width: 100%;

    border-collapse: collapse;

    background: white;

    border-radius: 10px;

    overflow: hidden;

    box-shadow: 0 3px 10px rgba(0,0,0,0.1);

}



th {

    background: #2e7d32;

    color: white;

    padding: 12px;

    text-align: left;

}


td {

    padding: 12px;

    border-bottom: 1px solid #eee;

}


tr:hover {

    background: #f1f8e9;

}



/* TAGS */

.tag {

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    color: white;

    display: inline-block;

}



.PLANTING {

    background: #388e3c;

}


.SPRAYING {

    background: #1976d2;

}


.FERTILIZER {

    background: #f57c00;

}


.MILK {

    background: #6a1b9a;

}


.FEEDING {

    background: #5d4037;

}



/* EDIT BUTTON */

.edit-btn {

    background: #1976d2;

    color: white;

    padding: 8px 12px;

    border-radius: 6px;

    text-decoration: none;

    display: inline-block;

    margin-right: 5px;

}


.edit-btn:hover {

    background: #0d47a1;

}



/* DELETE BUTTON */

.delete-btn {

    background: #d32f2f;

    color: white;

    padding: 8px 12px;

    border: none;

    border-radius: 6px;

    cursor: pointer;

}


.delete-btn:hover {

    background: #b71c1c;

}



.back {

    display: inline-block;

    margin-top: 25px;

    color: #2e7d32;

    text-decoration: none;

    font-weight: bold;

}


</style>

</head>
<body>


<header>

<h1>🌾 Farm Records</h1>

</header>
<div class="container">


<h2>📊 Activity Timeline</h2>



<a href="{% url 'add_activity' %}" class="add-btn">

➕ Add Activity

</a>
<table>


<tr>

<th>Date</th>

<th>Crop</th>

<th>Activity</th>

<th>Quantity</th>

<th>Notes</th>

<th>Actions</th>

</tr>
{% for r in records %}
<tr>
<td>
{{ r.date }}
</td>
<td>
{{ r.crop_name }}
</td>
<td>

<span class="tag {{ r.activity_type }}">

{{ r.activity_type }}

</span>

</td>
<td>
{{ r.quantity }}
</td>
<td>
{{ r.notes }}
</td>
<td>
<a href="{% url 'edit_farm_activity' r.id %}" class="edit-btn">
✏️ Edit
</a>
<a href="{% url 'delete_farm_activity' r.id %}" 
class="delete-btn">
🗑️ Delete
</a>
</td>
</tr>
{% empty %}
<tr>
<td colspan="6">
No records yet.
</td>
</tr>
{% endfor %}
</table>
<a href="{% url 'farmerdashboard' %}" class="back">
← Back to Dashboard
</a>
</div>
</body>
</html>
