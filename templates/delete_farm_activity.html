<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Delete Farm Record</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {

    background: #f4f6f4;

}


.container {

    width: 90%;

    max-width: 500px;

    background: white;

    margin: 80px auto;

    padding: 35px;

    border-radius: 12px;

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,0.1);

}


h1 {

    color: #d32f2f;

    margin-bottom: 20px;

}


p {

    font-size: 16px;

    margin-bottom: 25px;

    color: #333;

}


.record {

    background: #f8f8f8;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 25px;

}


.delete-btn {

    background: #d32f2f;

    color: white;

    border: none;

    padding: 12px 25px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;

}


.delete-btn:hover {

    background: #b71c1c;

}


.cancel-btn {

    background: #757575;

    color: white;

    padding: 12px 25px;

    border-radius: 8px;

    text-decoration: none;

    margin-left: 10px;

}



</style>


</head>


<body>


<div class="container">


<h1>⚠️ Delete Record</h1>



<p>
Are you sure you want to delete this farm activity?
</p>



<div class="record">


<p>
<strong>Activity:</strong>
{{ activity.activity_type }}
</p>


<p>
<strong>Crop:</strong>
{{ activity.crop_name }}
</p>


<p>
<strong>Date:</strong>
{{ activity.date }}
</p>



</div>




<form method="POST">

{% csrf_token %}


<button type="submit" class="delete-btn">

🗑️ Yes, Delete

</button>


<a href="{% url 'farm_records' %}" class="cancel-btn">

Cancel

</a>


</form>



</div>



</body>

</html>
