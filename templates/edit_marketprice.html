{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Market Price</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:500px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#2e7d32;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<header>

<h1>🌱 Urimi Digital</h1>

</header>

<div class="container">

<h2>✏ Edit Market Price</h2>

<form method="POST">

{% csrf_token %}

<label>Product Name</label>

<input
type="text"
name="product_name"
value="{{ price.product_name }}"
required>

<label>Category</label>

<select name="product_type">

<option value="Crop"
{% if price.product_type == "Crop" %}selected{% endif %}>
Crop
</option>

<option value="Livestock"
{% if price.product_type == "Livestock" %}selected{% endif %}>
Livestock
</option>

</select>

<label>County</label>

<input
type="text"
name="county"
value="{{ price.county }}"
required>

<label>Price (KSh)</label>

<input
type="number"
step="0.01"
name="price"
value="{{ price.price }}"
required>

<label>Unit</label>

<select name="unit">

<option value="Per Kg"
{% if price.unit == "Per Kg" %}selected{% endif %}>
Per Kg
</option>

<option value="Per Bag (90 Kg)"
{% if price.unit == "Per Bag (90 Kg)" %}selected{% endif %}>
Per Bag (90 Kg)
</option>

<option value="Per Litre"
{% if price.unit == "Per Litre" %}selected{% endif %}>
Per Litre
</option>

<option value="Per Animal"
{% if price.unit == "Per Animal" %}selected{% endif %}>
Per Animal
</option>

<option value="Per Crate"
{% if price.unit == "Per Crate" %}selected{% endif %}>
Per Crate
</option>

<option value="Per Tray"
{% if price.unit == "Per Tray" %}selected{% endif %}>
Per Tray
</option>

<option value="Per Bunch"
{% if price.unit == "Per Bunch" %}selected{% endif %}>
Per Bunch
</option>

</select>

<button type="submit">

Update Market Price

</button>

</form>

<a href="{% url 'officermarketprices' %}" class="back">

← Back to Market Prices

</a>

</div>

</body>
</html>
