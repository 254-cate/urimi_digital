<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer Farmer Question</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    color:#2e7d32;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:20px;
}

textarea{
    width:100%;
    height:180px;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

.question-box{
    background:#eef7ee;
    padding:15px;
    border-left:5px solid #2e7d32;
    margin-bottom:20px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>👩‍🌾 Reply to Farmer</h1>
</header>

<div class="container">

<h2>Farmer Question</h2>

<div class="question-box">

<p>{{ question.question }}</p>

{% if question.image %}
<br>
<img src="{{ question.image.url }}" width="300">
{% endif %}

</div>

<form method="POST">

{% csrf_token %}

<label>Your Reply</label>

<textarea
name="answer"
placeholder="Write your agricultural advice here..."
required></textarea>

<button type="submit">
Send Reply
</button>

</form>

<a href="{% url 'officer_questions' %}" class="back">
← Back to Questions
</a>

</div>

</body>
</html>
