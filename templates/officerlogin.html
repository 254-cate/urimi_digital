<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("markus-winkler-HeqXGxnsnX4-unsplash.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.container{

    width:400px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(10px);

    padding:40px;

    border-radius:15px;

    box-shadow:0 8px 20px rgba(0,0,0,.4);

    color:white;

    text-align:center;
}

.container h2{

    margin-bottom:30px;

    color:gold;
}

label{

    display:block;

    text-align:left;

    margin-bottom:8px;

    font-weight:bold;
}

input{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    border:none;

    border-radius:8px;

    font-size:16px;
}

input:focus{

    outline:none;

    border:2px solid #4CAF50;
}

button{

    width:100%;

    padding:15px;

    background:#4CAF50;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#2E7D32;

    transform:scale(1.02);
}

p{

    margin-top:20px;
}

a{

    color:gold;

    text-decoration:none;

    font-weight:bold;
}

a:hover{

    text-decoration:underline;
}

.logo{

    font-size:35px;

    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🌱</div>

<h2>officer Login</h2>
{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}


<form method="POST">
    {%csrf_token %}

<label>Username</label>

<input type="text" name="username" placeholder="Enter username" required>

<label>Password</label>

<input type="password" name="password" placeholder="Enter password" required>

<button type="submit">Login</button>

</form>

<p>
Don't have an account?
<a href="{% url 'officerregister' %}">Register here</a>
</p>

</div>

</body>
</html>
